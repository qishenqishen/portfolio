function reviewKpis(){const m=reviewMetrics(),items=[['signal','Group rating',m.rating.toFixed(2),'+0.08 in 30 days','rating','good'],['inbox','New reviews',m.newReviews,'+15%','all','good'],['inbox','Need response',m.needs,'−5 today','needs','warn'],['alert','1–2 star reviews',m.low,'−3 this week','low','bad'],['clock','Avg. response time',`${m.response.toFixed(1)}h`,'−1.3h','response','blue']];return `<div class="review-kpi-grid">${items.map(([ico,label,val,delta,filter,kind])=>`<button class="review-kpi-card ${kind}" data-review-kpi="${filter}"><div class="top"><span class="icon">${icon(ico,18)}</span><span class="delta ${kind==='bad'||kind==='warn'?'bad':''}">${delta}</span></div><div><b>${val}</b><strong>${label}</strong><small>${filter==='needs'?'Favie has drafts ready':filter==='low'?'High-priority review signal':filter==='response'?'Across the current scope':'Current scope'}</small></div></button>`).join('')}</div>`}
function compactReviewBrief(){const b=repBrief(),actions=activeCases().length;return `<div class="review-brief-compact"><div><div class="eyebrow">Favie brief · updated 8 min ago</div><h2>${b.title}</h2><p>${b.body}</p></div><div class="brief-stat"><b>${b.confidence}%</b><span>Confidence</span></div><button class="primary-button" data-page="queue">Review ${actions} prepared action${actions===1?'':'s'}</button></div>`}
function patternCard(t,type){const action=type==='positive'?`<button class="secondary-button" data-action="show-suggested-campaigns">Review campaign draft</button>`:`<button class="secondary-button" data-theme="${t.id}">Review actions</button>`;return `<article class="guest-pattern-card"><h4>${t.title}</h4><p>${t.summary}</p><div class="pattern-meta"><span>${t.mentions} mentions</span><span>${t.trend}</span><span>${t.locations}</span><span>${t.confidence}% confidence</span></div><div class="pattern-action"><small>${type==='positive'?'Favie prepared a campaign draft':t.status}</small>${action}</div></article>`}
function whatGuestsSay(){const scopedThemes=scoped(themes),issues=scopedThemes.filter(t=>t.sentiment==='Negative').slice(0,2),positive=scopedThemes.filter(t=>t.sentiment==='Positive').slice(0,2),requests=scopedThemes.filter(t=>t.sentiment==='Mixed').slice(0,2);return `<section class="guest-saying-wrap"><div class="guest-saying-head"><div><h2>What guests are saying</h2><p>Favie only surfaces a pattern when it connects to an operating action, content draft, or monitoring decision.</p></div><button class="secondary-button" data-page="review-inbox">Open review inbox</button></div><div class="guest-saying-grid"><section class="guest-saying-column"><header><h3>Issues to address</h3><span>${issues.length}</span></header>${issues.map(t=>patternCard(t,'issue')).join('')||emptyState('No active issue','No negative pattern meets the current threshold.')}</section><section class="guest-saying-column"><header><h3>Positive highlights</h3><span>${positive.length}</span></header>${positive.map(t=>patternCard(t,'positive')).join('')||emptyState('No positive pattern','No reusable positive pattern is active in this scope.')}</section><section class="guest-saying-column"><header><h3>Requests & suggestions</h3><span>${requests.length}</span></header>${requests.map(t=>patternCard(t,'request')).join('')||emptyState('No repeated requests','Favie is monitoring low-volume suggestions.')}</section></div></section>`}
function renderReviewsOverview(){const b=repBrief();return `<section class="page">${pageHeader('Reviews Overview','Monitor ratings, response workload, location differences, and the guest-feedback patterns that Favie turned into prepared actions.',`<button class="primary-button" data-page="review-inbox">Open Review Inbox</button>`)}${scopeBanner()}${reviewKpis()}${compactReviewBrief()}<div class="review-overview-grid"><section class="card chart-card-v7"><div class="headline-row"><div><h3>Wait-time complaints</h3><p class="chart-note">Recent seven days compared with the persistent 30-day daily baseline.</p></div><div><b>+42%</b><p class="chart-note">7 days vs baseline</p></div></div><div class="chart-shell">${waitChartSvg()}</div><div class="prepared-strip"><span>6 reply drafts ready</span><span>1 manager verification request</span><span>Evidence linked</span></div></section><div class="review-overview-side"><section class="card chart-card-v7"><div class="headline-row"><div><h3>Rating by location</h3><p class="chart-note">A stable average can hide location-level gaps.</p></div></div><div class="rating-list">${ratingRows()}</div></section><section class="card chart-card-v7"><div class="headline-row"><div><h3>Response time by location</h3><p class="chart-note">Target: under 6 hours.</p></div></div><div class="response-list">${responseRows()}</div></section></div></div>${whatGuestsSay()}</section>`}
function reviewFilterCounts(){const list=scopedReviewRecords();return {all:list.length,needs:list.filter(r=>['needs','draft'].includes(reviewStatus(r))).length,low:list.filter(r=>r.rating<=2).length,escalated:list.filter(r=>reviewStatus(r)==='escalated').length,replied:list.filter(r=>reviewStatus(r)==='replied').length}}
function filterOption(key,label,count,kind='status'){const current=kind==='status'?state.reviewInboxFilter:kind==='platform'?state.reviewPlatformFilter:state.reviewCategoryFilter;const attr=kind==='status'?'data-review-filter':kind==='platform'?'data-review-platform':'data-review-category';return `<button class="filter-option ${current===key?'active':''}" ${attr}="${key}"><span>${label}</span><b>${count??''}</b></button>`}
function renderReviewFilters(){const c=reviewFilterCounts(),list=scopedReviewRecords(),catCount=name=>list.filter(r=>reviewCategory(r)===name).length;return `<aside class="review-filter-panel"><h4>Folders</h4>${filterOption('all','All reviews',c.all)}${filterOption('needs','Needs response',c.needs)}${filterOption('low','1–2 stars',c.low)}${filterOption('escalated','Escalated',c.escalated)}${filterOption('replied','Replied',c.replied)}<div class="filter-separator"></div><h4>Platforms</h4>${filterOption('all','All platforms',list.length,'platform')}${filterOption('Google','Google',list.filter(r=>r.platform==='Google').length,'platform')}${filterOption('Yelp','Yelp',list.filter(r=>r.platform==='Yelp').length,'platform')}<div class="filter-separator"></div><h4>Categories</h4>${['Service','Food quality','Wait time','Cleanliness','Value','Other'].map(x=>filterOption(x,x,catCount(x),'category')).join('')}<div class="filter-separator"></div><h4>Platform status</h4><div class="platform-status-line"><span>Google</span><b class="good">Full sync</b></div><div class="platform-status-line"><span>Yelp</span><b class="warn">Limited sync</b></div></aside>`}
function reviewListItem(r){const status=reviewStatus(r),loc=locationName(r.location_id);return `<button class="review-list-item ${state.selectedReviewId===r.id?'active':''}" data-review-id="${r.id}"><div class="review-item-head"><span class="review-initial">${r.reviewer[0]}</span><div class="review-item-main"><strong>${r.reviewer}</strong><small>${loc} · ${r.platform} · ${r.time}</small></div>${pill(status==='needs'?'Needs response':status==='draft'?'Draft ready':status==='escalated'?'Escalated':'Replied',status==='escalated'?'bad':status==='replied'?'good':status==='draft'?'neutral':'warn')}</div><div class="review-item-rating">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div class="review-item-text">“${esc(r.text)}”</div><div class="review-item-tags"><span>${reviewCategory(r)}</span>${(r.topics||[]).slice(0,1).map(t=>`<span>${t}</span>`).join('')}</div></button>`}
function renderReviewDetail(r){if(!r)return `<div class="review-detail-panel">${emptyState('No review selected','Choose a review from the list.')}</div>`;const c=caseForReview(r),status=reviewStatus(r),facts=c?.facts||[{text:`Guest submitted a ${r.rating}-star ${r.platform} review`,evidence_ids:[r.id]},{text:`The review explicitly mentions ${(r.topics||[]).join(', ')||'the visit experience'}`,evidence_ids:[r.id]}],inference=c?.inference||(r.rating>=4?'The review is positive and appropriate for a personalized appreciation response.':'The review indicates a service-recovery need, but the underlying operational cause is not confirmed.'),alternative=c?.alternative||(r.rating>=4?'No material alternative explanation is required for the public response.':'The experience may reflect a one-time event, peak demand, or incomplete context.'),draft=c?.draft||defaultReplyForReview(r),risk=c?.risk||(r.rating<=2?'Medium':'Low');return `<section class="review-detail-panel"><div class="review-detail-top"><div class="review-detail-person"><span class="review-initial">${r.reviewer[0]}</span><div><h2>${r.reviewer}</h2><p>${locationName(r.location_id)} · ${r.platform} · ${r.time}</p><div class="review-item-rating">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div></div></div>${pill(status==='escalated'?'Escalated':status==='replied'?'Replied':'Draft ready',status==='escalated'?'bad':status==='replied'?'good':'warn')}</div><blockquote class="review-quote">“${esc(r.text)}”</blockquote><div class="review-context-strip"><div><b>${r.rating}/5</b><span>Rating</span></div><div><b>${r.platform}</b><span>Platform</span></div><div><b>${risk}</b><span>Risk</span></div><div><b>${c?.confidence||92}%</b><span>Confidence</span></div></div><div class="analysis-box"><div><span>Verified facts</span>${facts.map(f=>`<p><button class="evidence-source-button" data-evidence="${f.evidence_ids[0]}">• ${f.text}</button></p>`).join('')}</div><div><span>Favie interpretation</span><p>${inference}</p><span style="display:block;margin-top:9px">Alternative explanation</span><p>${alternative}</p></div></div><div class="reply-editor"><h3>Prepared public reply · ${c?.strategy||'Personalized response'}</h3><textarea id="review-reply-editor">${draft}</textarea></div><div class="review-actions"><button class="primary-button dark" data-review-action="approve" data-id="${r.id}">Approve & post</button><button class="secondary-button" data-review-action="save" data-id="${r.id}">Save adjustment</button><button class="secondary-button" data-review-action="regenerate" data-id="${r.id}">Regenerate</button><button class="secondary-button" data-review-action="escalate" data-id="${r.id}">Escalate</button><button class="text-button" data-review-action="dismiss" data-id="${r.id}">Dismiss</button></div></section>`}
function renderReviewInbox(){const list=filteredReviewRecords(),selected=ensureSelectedReview(list),counts=reviewFilterCounts();return `<section class="page">${pageHeader('Review Inbox','Review original feedback, inspect Favie’s evidence-backed analysis, adjust the prepared reply, and approve only the final action.',`<button class="secondary-button" data-page="signals">Back to Overview</button>`)}${scopeBanner()}<div class="review-inbox-summary"><button class="${state.reviewInboxFilter==='needs'?'active':''}" data-review-filter="needs">${counts.needs} need response</button><button class="${state.reviewInboxFilter==='low'?'active':''}" data-review-filter="low">${counts.low} low ratings</button><button class="${state.reviewInboxFilter==='escalated'?'active':''}" data-review-filter="escalated">${counts.escalated} escalated</button><button class="${state.reviewInboxFilter==='replied'?'active':''}" data-review-filter="replied">${counts.replied} replied</button></div><div class="review-inbox-layout">${renderReviewFilters()}<section class="review-list-panel"><div class="review-list-toolbar"><select><option>Newest first</option><option>Lowest rating</option></select><select><option>All locations</option></select></div><div class="review-list-scroll">${list.map(reviewListItem).join('')||emptyState('No matching reviews','Change the folder, platform, category, or scope.')}</div></section>${renderReviewDetail(selected)}</div></section>`}

const v6BindPageEvents=bindPageEvents,v6HandleAction=handleAction,v6RenderCampaigns=renderCampaigns,v6AgentStatusDrawer=agentStatusDrawer;
renderNav=function(){const sections=[['HOME','agent-home','home','Agent Brief'],['WORK','queue','inbox','Approvals'],['','escalations','alert','Critical Issues'],['','activity','clock','Activity'],['REVIEWS','signals','signal','Overview'],['','review-inbox','inbox','Review Inbox'],['SOCIAL','campaigns','campaign','Campaigns'],['','local-content','spark','Local Content'],['','calendar','calendar','Content Calendar'],['','coverage','alert','Publishing Status'],['MANAGE','locations','location','Locations'],['SETTINGS','policies','shield','Automation Rules'],['','brand-context','evidence','Brand & Voice'],['','integrations','signal','Connections'],['','team-roles','bot','Team & Access']];const approvalCount=countRoute('batch')+countRoute('manual'),criticalCount=countRoute('escalated'),needs=reviewMetrics().needs;nav.innerHTML=sections.map(([label,page,ico,text])=>`${label?`<div class="nav-section-label">${label}</div>`:''}<button class="nav-item ${state.page===page?'active':''}" data-page="${page}"><span class="nav-icon">${icon(ico)}</span><span>${text}</span>${page==='queue'&&approvalCount?`<b class="nav-count">${approvalCount}</b>`:''}${page==='escalations'&&criticalCount?`<b class="nav-count">${criticalCount}</b>`:''}${page==='review-inbox'&&needs?`<b class="nav-count">${needs}</b>`:''}${page==='coverage'&&scoped(coverageAnomalies).length?`<b class="nav-count">${scoped(coverageAnomalies).length}</b>`:''}</button>`).join('')}
renderSignals=renderReviewsOverview;
renderQueue=function(){return v5RenderQueue().replace('Needs your attention','Approvals').replaceAll('Review & Approve','Approvals').replaceAll('Action Center','Approvals').replace('Favie has already analyzed the evidence and prepared the output. Review approvals, judgment calls, and critical cases here.','Approve prepared work across Reviews and Social. Complex review analysis remains available in Review Inbox.').replaceAll('Critical Cases','Critical Issues')}
renderCampaigns=function(){return v6RenderCampaigns().replaceAll('View Guest Trends','View Reviews Overview').replaceAll('data-page="themes"','data-page="signals"')}
renderAgentHome=function(){return v5RenderAgentHome().replaceAll('Guest Trends','What guests are saying').replaceAll('Review & Approve','Approvals').replaceAll('Open Review & Approve','Open Approvals').replaceAll('Content Opportunities','suggested campaigns').replaceAll('Social Health','Publishing Status')}
agentStatusDrawer=function(){v6AgentStatusDrawer();if(drawer)drawer.innerHTML=drawer.innerHTML.replaceAll('Guest Trends','guest-feedback patterns').replaceAll('Customer Themes','guest-feedback patterns')}
bindPageEvents=function(){v6BindPageEvents();document.querySelectorAll('[data-review-id]').forEach(el=>el.addEventListener('click',()=>{state.selectedReviewId=el.dataset.reviewId;render()}));document.querySelectorAll('[data-review-filter]').forEach(el=>el.addEventListener('click',()=>{state.reviewInboxFilter=el.dataset.reviewFilter;render()}));document.querySelectorAll('[data-review-platform]').forEach(el=>el.addEventListener('click',()=>{state.reviewPlatformFilter=el.dataset.reviewPlatform;render()}));document.querySelectorAll('[data-review-category]').forEach(el=>el.addEventListener('click',()=>{state.reviewCategoryFilter=el.dataset.reviewCategory;render()}));document.querySelectorAll('[data-review-kpi]').forEach(el=>el.addEventListener('click',()=>{const f=el.dataset.reviewKpi;if(['needs','low'].includes(f)){state.reviewInboxFilter=f;state.page='review-inbox'}else if(f==='all'){state.reviewInboxFilter='all';state.page='review-inbox'}else if(f==='response'){openTrend('response-trend')}else openTrend('rating-gap');render()}));document.querySelectorAll('[data-review-action]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.id,action=el.dataset.reviewAction,r=evidenceById(id);if(action==='approve'){if(id==='rv-108'){toast('Execution blocked','This critical review requires an authorized risk owner.');return}if(!state.reviewResolvedIds.includes(id))state.reviewResolvedIds.push(id);state.activityLog.unshift({time:'Just now',title:`Review reply approved: ${r.reviewer}`,detail:`Published to ${r.platform} in prototype mode.`,scope_ids:[r.location_id]});toast('Reply approved','The review moved to Replied.')}else if(action==='save')toast('Adjustment saved','Favie will use the edited version for this review only.');else if(action==='regenerate'){const ta=document.querySelector('#review-reply-editor');if(ta)ta.value=defaultReplyForReview(r)+' Thank you for giving us the opportunity to improve.';toast('Alternative prepared','No action has been published.')}else if(action==='escalate'){if(!state.reviewEscalatedIds.includes(id))state.reviewEscalatedIds.push(id);toast('Review escalated','Public execution is paused and an owner task is prepared.')}else if(action==='dismiss'){state.reviewResolvedIds.push(id);toast('Review dismissed','The decision is retained in Activity and will not silently resurface.')}render()}))}
handleAction=function(action,el){if(action==='help'){openModal(`<div class="modal-header"><div><h2>How to explore v7</h2><p>Reviews now combine operational visibility with Agent-first approval.</p></div><button class="close-button" data-action="close-modal">×</button></div><div class="modal-body"><div class="guide-grid">${[['1','Reviews Overview','Scan core review KPIs, Favie’s brief, charts, and actionable guest-feedback patterns.'],['2','Review Inbox','Inspect individual reviews, evidence, analysis, and prepared replies in one workspace.'],['3','Approvals','Approve cross-module batches and prepared actions.'],['4','Campaigns','Review campaign suggestions generated from positive guest feedback.'],['5','Publishing Status','Resolve account, asset, publish, and campaign-compliance issues.']].map(x=>`<div><b>${x[0]}</b><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div></div>`);return}v6HandleAction(action,el)}
render=function(){if(state.page==='themes'||state.page==='opportunities')state.page='signals';renderNav();updateScopeHeader();const r={'agent-home':renderAgentHome,queue:renderQueue,escalations:renderEscalations,activity:renderActivityPage,signals:renderReviewsOverview,'review-inbox':renderReviewInbox,coverage:renderCoverage,campaigns:renderCampaigns,'local-content':renderLocalContent,calendar:renderCalendar,locations:renderLocations,policies:renderPolicies,'brand-context':renderBrandContext,integrations:renderIntegrations,'team-roles':renderTeamRoles};appMain.innerHTML=(r[state.page]||renderAgentHome)();bindPageEvents();const footer=document.querySelector('.prototype-label');if(footer)footer.textContent='Agent-first restaurant operations prototype · v7.0'}


// global handlers
document.querySelector('#scope-button').addEventListener('click',e=>{e.stopPropagation();scopePopover.classList.contains('hidden')?openScope():closeScope()});document.addEventListener('click',e=>{if(!scopePopover.contains(e.target)&&!document.querySelector('#scope-button').contains(e.target))closeScope()});scopePopover.addEventListener('click',e=>{const opt=e.target.closest('[data-scope]');if(opt){state.scope=JSON.parse(opt.dataset.scope);state.selectedCase=null;state.queueFilter='batch';closeScope();toast('Agent scope changed',`${state.scope.eyebrow} · ${state.scope.name}. All objects were refiltered.`);render()}});drawerBackdrop.addEventListener('click',closeDrawer);modalBackdrop.addEventListener('click',closeModal);document.querySelector('.brand').addEventListener('click',()=>{state.page='agent-home';render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeScope();closeDrawer();closeModal()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#global-search').focus()}});document.querySelector('#global-search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){const q=e.target.value.trim();e.target.value='';state.page='agent-home';render();setTimeout(()=>{const i=document.querySelector('#agent-input');if(i){i.value=q;handleAction('send-agent')}},80)}});render();

</script>
