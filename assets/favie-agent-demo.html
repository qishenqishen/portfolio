/* v4.1 visual fix: Trend Insight cards were rendered with a new class name
   but the old CSS selector remained, causing default browser button styles. */
.metric-evidence-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;
  margin-bottom:18px;
}
.metric-evidence-card{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  min-width:0;
  min-height:224px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  text-align:left;
  position:relative;
  overflow:hidden;
  padding:18px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--surface);
  color:var(--text);
  font:inherit;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.metric-evidence-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--green);
}
.metric-evidence-card.forced::before{background:var(--amber)}
.metric-evidence-card:hover{
  transform:translateY(-2px);
  border-color:var(--accent-border);
  box-shadow:0 12px 30px rgba(35,28,22,.09);
}
.metric-evidence-card:focus-visible{
  outline:3px solid var(--accent-soft);
  outline-offset:2px;
}
.metric-evidence-card .metric-icon{
  width:36px;
  height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  margin-bottom:16px;
  background:var(--green-soft);
  color:var(--green);
}
.metric-evidence-card.forced .metric-icon{
  background:var(--amber-soft);
  color:var(--amber);
}
.metric-evidence-card .metric-number{
  font-size:30px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.7px;
  margin:0 0 5px;
}
.metric-evidence-card .metric-name{
  font-size:13px;
  line-height:1.25;
  font-weight:760;
  color:var(--text);
}
.metric-evidence-card .metric-trend{
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
}
.metric-evidence-card .metric-story{
  width:100%;
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid var(--border);
}
.metric-evidence-card .metric-story strong{
  display:block;
  font-size:12px;
  line-height:1.35;
  margin-bottom:6px;
}
.metric-evidence-card .metric-story p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}
.metric-evidence-card .forced-review-badge{
  margin-top:12px;
}
@media(max-width:760px){
  .metric-evidence-grid{grid-template-columns:1fr}
  .metric-evidence-card{min-height:auto}
}

}

function situationCard(kicker,title,meta,body,button,action,kind='neutral'){return `<article class="situation-card ${kind}"><div class="situation-kicker">${kicker}</div><h3>${title}</h3><strong>${meta}</strong><p>${body}</p><button data-action="${action}">${button} →</button></article>`}

function policyLevelText(level){return level==='auto'?'Auto execute':level==='batch'?'Batch approval':'Manual review'}

function homeSituations(){
  const result=[];
  const high=scoped(cases).find(c=>caseRoute(c)==='escalated')||scoped(cases).find(c=>caseRoute(c)==='manual')||scoped(cases).find(c=>caseRoute(c)==='batch');
  if(high)result.push({k:high.priority==='Critical'?'Critical':'Needs decision',t:high.title,m:high.subtitle,b:`Favie prepared the evidence, draft, and next action. Route: ${routeLabel(caseRoute(high))}.`,btn:'Review case',action:'open-case-id',id:high.id,kind:high.priority==='Critical'?'bad':'green'});
  const anomaly=scoped(coverageAnomalies)[0];if(anomaly)result.push({k:'Coverage anomaly',t:anomaly.title,m:`${anomaly.location} · ${anomaly.detected}`,b:anomaly.action,btn:'Review anomaly',action:'open-coverage-id',id:anomaly.id,kind:'bad'});
  const opp=scoped(opportunities).find(o=>!state.briefApprovedIds.includes(o.id));if(opp)result.push({k:'Content opportunity',t:opp.theme,m:opp.evidence,b:'Favie already prepared the brief, scope, requirements, and fallback.',btn:'Review brief',action:'open-opportunity-id',id:opp.id,kind:'purple'});
  const batch=scoped(cases).find(c=>caseRoute(c)==='batch');if(batch&&!result.some(x=>x.id===batch.id))result.push({k:'Ready for batch approval',t:batch.title,m:batch.subtitle,b:'Quality checks passed. You can approve the scoped batch in one action.',btn:'Review batch',action:'open-case-id',id:batch.id,kind:'green'});
  return result.slice(0,3)
}
function renderAgentHome(){

  <div class="agent-brief-hero"><div class="agent-orb">${icon('spark',30)}</div><div class="brief-copy"><div class="eyebrow">FAVIE AGENT BRIEF · ${state.scope.name.toUpperCase()}</div><h2>${decisions} decision${decisions===1?'':'s'} need your attention.</h2><p>Everything else is analyzed, drafted, routed, auto-handled, or waiting on an external owner. Counts are computed from scoped objects rather than hard-coded page copy.</p><div class="agent-object-strip"><span>Trend Insight</span><span>Topic Insight</span><span>Risk Case</span><span>Coverage Anomaly</span><span>Campaign Draft</span></div></div><div class="brief-actions"><button class="primary-button dark" data-page="queue">Review decisions</button><button class="secondary-button" data-action="show-activity">View agent activity</button></div></div>
  <div class="brief-grid">${situations.length?situations.map(s=>`<article class="situation-card ${s.kind}"><div class="situation-kicker">${s.k}</div><h3>${s.t}</h3><strong>${s.m}</strong><p>${s.b}</p><button data-action="${s.action}" data-id="${s.id}">${s.btn} →</button></article>`).join(''):emptyState('No decisions in this scope','Favie has no unresolved approvals, escalations, opportunities, or coverage anomalies for the selected scope.')}</div>
  <div class="agent-intelligence-grid"><section class="card intelligence-panel"><div class="section-heading"><div><div class="signal-object-label"><i></i> Persistent Trend Insights</div><h3>Changes that matter</h3><p>Delta, evidence, interpretation, alternatives, confidence, and route were generated by the agent.</p></div><button class="text-button" data-page="signals">View all →</button></div><div class="trend-stack">${scopedTrends.length?scopedTrends.slice(0,3).map(t=>trendBrief(t)).join(''):emptyState('No scoped trends','Select a wider scope to view group and brand trends.')}</div></section>
  <section class="card intelligence-panel"><div class="section-heading"><div><div class="signal-object-label"><i></i> Dynamic Topic Insights</div><h3>Themes Favie discovered</h3><p>Semantic clusters are filtered by scope and retain source evidence.</p></div><button class="text-button" data-page="themes">Explore all →</button></div><div class="theme-mini-list">${scopedThemes.length?scopedThemes.slice(0,5).map(t=>themeMini(t)).join(''):emptyState('No themes in scope','No persistent topic object currently matches this location.')}</div></section></div>
  <section class="card context-architecture"><div class="section-heading"><div><h3>Where the intelligence lives</h3><p>ZooClaw performs continuous analysis and creates structured objects. Favie Web is the approval, evidence, and audit workspace.</p></div><span class="always-on-badge"><i></i> Agent active</span></div><div class="architecture-flow"><div class="architecture-node"><h4>Connected evidence</h4><p>Reviews, locations, policies, platform status, campaigns, and requirements.</p></div><div class="architecture-arrow">→</div><div class="architecture-node agent"><h4>ZooClaw agent context</h4><p>Scope filtering, trend baselines, topic clustering, risk, drafting, matching, anomalies, and routing.</p></div><div class="architecture-arrow">→</div><div class="architecture-node"><h4>Favie approval workspace</h4><p>Inspect sources, make final edits, approve, dismiss, escalate, and audit outcomes.</p></div></div></section>
  <div class="agent-home-grid"><section class="card agent-command-card"><div class="section-heading"><div><h3>Ask Favie</h3><p>Give intent; Favie prepares a scoped action packet instead of asking you to operate every page.</p></div><span class="live-label"><i></i> ${state.scope.name}</span></div><div id="chat-messages" class="agent-chat-home">${state.agentMessages.slice(-4).map(m=>`<div class="chat-bubble ${m.role}">${m.role==='assistant'?'<div class="tiny-agent">F</div>':''}<div>${m.text}</div></div>`).join('')}</div><div class="prompt-chips"><button data-prompt="Show only the unresolved actions in the current scope.">Explain scope</button><button data-prompt="Explain the highest-priority trend and show linked evidence.">Investigate trend</button><button data-prompt="Review the strongest content opportunity for this scope.">Review content brief</button></div><div class="agent-composer"><input id="agent-input" placeholder="Ask Favie to investigate, prepare, adjust, approve, or dismiss…"><button data-action="send-agent">${icon('send',18)}</button></div></section>

function trendBrief(t){const forced=forcedByConfidence(t);return `<button class="trend-brief-card" data-insight="${t.id}"><div class="trend-value"><b>${t.value}</b><span>${t.metric}</span></div><div class="trend-story"><strong>${t.headline}</strong><p>${t.evidence}</p>${forced?`<div class="low-confidence-note">Confidence ${t.confidence}% is below the ${state.confidenceThreshold}% threshold → forced human review.</div>`:''}</div><div class="trend-end"><span class="confidence-pill ${t.confidence<80?'medium':''}">${confidenceLabel(t.confidence)} · ${t.confidence}%</span><span class="text-link">Why? →</span></div></button>`}
function themeMini(t){return `<button class="theme-mini-card ${t.sentiment==='Positive'?'positive':t.group==='Recurring'?'recurring':''}" data-theme="${t.id}"><i></i><div><strong>${t.title}</strong><span>${t.mentions} mentions · ${t.locations} · ${t.group}</span>${forcedByConfidence(t)?`<small class="forced-review-badge">Forced review</small>`:''}</div><b>${t.trend}</b></button>`}

function caseRow(c,active){const route=caseRoute(c),notice=state.policyChangeNotice?.affected?.includes(c.id);return `<button class="case-row ${active?'active':''}" data-case="${c.id}"><div class="case-row-top"><span class="case-priority ${priorityKind(c.priority)}">${c.priority}</span>${pill(routeLabel(route),route==='escalated'?'bad':route==='manual'?'warn':route==='batch'?'neutral':'good')}</div><h4>${c.title}</h4><p>${c.subtitle}</p><div class="case-row-foot"><span>${c.location}</span><span>${c.confidence}% confidence</span></div>${forcedByConfidence(c)?'<span class="forced-review-badge">Low confidence override</span>':''}${notice?`<span class="policy-match-badge">Policy matched → ${routeLabel(route)}</span>`:''}</button>`}
function ensureSelectedCase(list){if(!list.some(c=>c.id===state.selectedCase))state.selectedCase=list[0]?.id||null;return list.find(c=>c.id===state.selectedCase)||list[0]}

  return `<section class="page">${pageHeader('Decision queue','Batch approval and manual review both enter this workspace. Batch items support grouped approval; manual items require case-by-case judgment.',`<button class="secondary-button" data-action="approve-safe">Review scoped batch</button>`)}${scopeBanner()}${notice}<div class="approval-first-banner"><div><strong>The agent has already completed analysis and drafting.</strong><p>Policy routing and the confidence threshold decide what reaches this queue.</p></div><div class="object-flow"><span>Evidence</span><b>→</b><span>Agent analysis</span><b>→</b><span>Policy decision</span><b>→</b><span>Your approval</span></div></div>

function renderFacts(c){return c.facts.map(f=>`<button class="fact-evidence-link" data-evidence="${f.evidence_ids[0]}" data-case-id="${c.id}"><span style="all:unset">${esc(f.text)}</span><span>${f.evidence_ids.length} source${f.evidence_ids.length>1?'s':''}</span></button>`).join('')}
function renderCaseDetail(c){const route=caseRoute(c),dismissed=route==='dismissed',completed=route==='completed';return `<div class="case-detail-head"><div><div class="case-kicker">AGENT CASE · ${c.location.toUpperCase()}</div><h2>${c.title}</h2><p>${c.subtitle}</p><div class="case-route-line">${pill(`Risk: ${c.risk}`,riskKind(c.risk))}${pill(routeLabel(route),route==='escalated'?'bad':route==='manual'?'warn':route==='batch'?'neutral':'good')}${forcedByConfidence(c)?'<span class="forced-review-badge">Confidence threshold override</span>':''}</div></div><div>${pill(`Confidence ${c.confidence}%`,c.confidence>=80?'good':'warn')}</div></div>
  <div class="agent-assessment-strip"><div class="agent-mini-orb">F</div><div><strong>Favie prepared the output before this page loaded.</strong><span>${c.agentWork.join(' · ')}</span></div><button class="secondary-button" data-action="view-evidence">View all evidence</button></div>
  <div class="truth-grid"><div class="truth-block fact"><span>FACTS · CLICK TO TRACE</span>${renderFacts(c)}</div><div class="truth-block inference"><span>AGENT INTERPRETATION</span><p>${c.inference}</p><p><strong>Alternative:</strong> ${c.alternative}</p><em>Confidence: ${c.confidence}%</em></div><div class="truth-block recommendation"><span>RECOMMENDED NEXT STEP</span><p>${c.recommendation}</p></div></div>
  <div class="reply-section"><div class="section-heading"><div><h3>Prepared public response</h3><p>Favie selected a strategy based on evidence, risk, policy, and scope.</p></div><div class="strategy-control"><button data-strategy="warm" class="${state.replyStrategy==='warm'?'active':''}">Warm</button><button data-strategy="service" class="${state.replyStrategy==='service'?'active':''}">Service recovery</button><button data-strategy="brief" class="${state.replyStrategy==='brief'?'active':''}">Shorter</button></div></div><textarea id="case-reply" ${dismissed||completed?'disabled':''}>${esc(c.draft)}</textarea></div>
  <div class="internal-followup"><div><span class="small-label">INTERNAL FOLLOW-UP</span><strong>${c.recommendation}</strong></div><button class="secondary-button" data-action="assign-manager" ${dismissed||completed?'disabled':''}>Send to manager</button></div>
  <div class="object-status-grid"><div><span>Object status</span><b>${dismissed?'Dismissed':completed?'Executed':'Drafted'}</b></div><div><span>Approval status</span><b>${completed?'Approved':dismissed?'Not required':'Pending'}</b></div><div><span>Execution status</span><b>${completed?'Executed':dismissed?'Cancelled':'Not executed'}</b></div><div><span>Next actor</span><b>${dismissed||completed?'None':route==='batch'?'Group operator':'Authorized reviewer'}</b></div></div>
  ${dismissed?`<div class="low-confidence-note">Dismissed: ${state.dismissedCases[c.id]?.reason}. The decision remains in the audit log and suppresses duplicate resurfacing until new evidence materially changes the object.</div>`:''}

function renderEscalations(){const list=scoped(cases).filter(c=>caseRoute(c)==='escalated');return `<section class="page">${pageHeader('Escalations','High-risk situations are paused and routed to the correct owner.',`<button class="secondary-button" data-page="policies">View escalation policy</button>`)}${scopeBanner()}${list.length?`<div class="escalation-layout"><section class="card escalation-card"><div class="escalation-banner">${icon('alert',22)} PUBLIC RESPONSE PAUSED</div>${renderCaseDetail(list[0])}</section><aside class="card escalation-side"><h3>Escalation chain</h3>${['Favie detected high-risk language','Public auto-response blocked','Risk owner task prepared','Location facts requested','Awaiting human instruction'].map((x,i)=>`<div class="chain-step ${i<3?'done':''}"><span>${i<3?'✓':i+1}</span><div><strong>${x}</strong><p>${i===2?'8:51 AM · In-app task':i===3?'Due within 2 hours':'Policy event logged'}</p></div></div>`).join('')}</aside></div>`:emptyState('No escalations in this scope','Critical and blocked cases from other locations are hidden by the active Scope.')}</section>`}

function renderSignals(){const list=scoped(trendInsights);return `<section class="page">${pageHeader('Trend intelligence','Favie maintains persistent scoped baselines. The page reads Trend Insight objects instead of calculating deltas when it loads.',`<button class="secondary-button" data-page="themes">Explore dynamic themes</button>`)}${scopeBanner()}<div class="signal-banner"><div><span>AGENT SITUATION BRIEF</span><h2>${list[0]?.headline||'No scoped trend currently requires attention.'}</h2><p>Every trend includes evidence, an interpretation, alternatives, confidence, freshness, and a prepared route.</p></div><button class="primary-button" data-page="queue">Review routed actions</button></div><div class="metric-evidence-grid">${list.length?list.map(metricEvidence).join(''):emptyState('No trend objects','Widen the Scope to see brand and organization trends.')}</div><div class="card signal-table-card"><div class="section-heading"><div><h3>Persistent Trend Insight objects</h3><p>Low-confidence objects are forced to human review regardless of the action policy.</p></div><span class="scope-context-chip">Threshold ${state.confidenceThreshold}%</span></div><table class="agent-table"><thead><tr><th>Insight</th><th>Scope</th><th>Confidence</th><th>Route</th><th>Prepared action</th><th>Status</th></tr></thead><tbody>${list.map(t=>`<tr class="clickable-row" data-insight="${t.id}"><td><strong>${t.metric}</strong><span>${t.value} · ${t.window}</span></td><td>${t.scope}</td><td>${pill(`${t.confidence}%`,forcedByConfidence(t)?'warn':'good')}</td><td>${forcedByConfidence(t)?'Manual review':'Policy route'}</td><td>${t.action}</td><td>${pill(t.status,t.status==='Needs decision'?'bad':t.status==='Agent prepared'?'good':'neutral')}</td></tr>`).join('')}</tbody></table></div></section>`}

function renderThemes(){const list=scoped(themes),groups=['Emerging','Recurring','Positive strengths'];return `<section class="page">${pageHeader('Agent-generated themes','Stable parent categories preserve reporting; dynamic themes reveal new operational patterns.',`<button class="secondary-button" data-action="show-theme-methodology">Theme methodology</button>`)}${scopeBanner()}<div class="theme-intro"><div>${icon('themes',26)}</div><div><strong>Favie continuously clusters review language into persistent scoped themes.</strong><p>Each theme keeps source evidence, location distribution, lifecycle, confidence, and action status.</p></div></div><div class="theme-columns">${groups.map(g=>`<section><div class="theme-column-head"><h3>${g}</h3><span>${list.filter(t=>t.group===g).length}</span></div>${list.filter(t=>t.group===g).map(themeCard).join('')||emptyState('No themes','No theme in this group matches the selected scope.')}</section>`).join('')}</div></section>`}
function openTheme(t){const records=t.evidence_ids.map(evidenceById).filter(Boolean);openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">DYNAMIC TOPIC INSIGHT</div><h2>${t.title}</h2><p>${t.mentions} mentions · ${t.trend} · ${t.locations}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="drawer-status-row">${pill(t.sentiment,t.sentiment==='Positive'?'good':'bad')}${pill(`${t.confidence}% confidence`,forcedByConfidence(t)?'warn':'good')}${forcedByConfidence(t)?'<span class="forced-review-badge">Forced review</span>':''}</div><div class="detail-section"><h3>What Favie observed</h3><p>${t.summary}</p></div><div class="detail-section inference-panel"><span>ROOT-CAUSE HYPOTHESIS</span><h3>${t.root}</h3><p>This is an inference, not a confirmed fact. Operational verification is required before treating it as the cause.</p></div><div class="detail-section"><h3>Linked evidence</h3>${records.map(r=>`<blockquote><button class="evidence-source-button" data-evidence="${r.id}">${esc(r.text)}<br><small>${r.id} · ${locationName(r.location_id)} · ${r.platform}</small></button></blockquote>`).join('')}</div><div class="detail-section"><h3>Prepared action</h3><p>${t.status}</p></div></div><div class="drawer-footer"><button class="secondary-button" data-action="close-drawer">Close</button>${t.sentiment==='Positive'?`<button class="primary-button" data-action="open-opportunity-from-theme" data-id="${t.id}">Review content opportunity</button>`:'<button class="primary-button dark" data-action="assign-manager">Request manager verification</button>'}</div>`)}

function opportunityCard(o){const approved=state.briefApprovedIds.includes(o.id);return `<article class="card opportunity-card"><div class="opportunity-main"><div class="opportunity-icon">${icon('spark',22)}</div><div><div class="opportunity-kicker">${o.theme}</div><h3>${o.title}</h3><p>${o.angle}</p><button class="evidence-line" data-evidence="${o.evidence_ids[0]}">${icon('evidence',15)} ${o.evidence}</button></div></div><div class="opportunity-plan"><div><span>RECOMMENDED SCOPE</span><strong>${o.scope}</strong></div><div><span>DELIVERABLES</span><strong>${o.deliverables}</strong></div><div><span>AGENT WORK</span><strong>${o.agent.length} items complete</strong></div></div><div class="opportunity-actions">${pill(approved?'Approved':o.status,approved?'good':o.status==='Ready for approval'?'good':'warn')}<button class="secondary-button" data-opportunity="${o.id}">Open brief</button>${!approved?`<button class="primary-button" data-action="approve-brief-id" data-id="${o.id}">Approve brief</button>`:''}</div></article>`}
function renderOpportunities(){const list=scoped(opportunities);return `<section class="page">${pageHeader('Content opportunities','Favie turns recurring review evidence into complete, scoped, reviewable social briefs.',`<button class="secondary-button" data-page="policies">Opportunity policy</button>`)}${scopeBanner()}<div class="opportunity-overview"><div><span>REVIEW → CONTENT LOOP</span><h2>${list.length} scoped opportunit${list.length===1?'y is':'ies are'} prepared. You only approve, adjust, or dismiss.</h2></div><div class="opportunity-mini-stats"><div><b>${list.filter(o=>o.theme!=='Reservation expectations').length}</b><span>Positive themes</span></div><div><b>${list.filter(o=>o.status==='Needs operator input').length}</b><span>Education needs</span></div><div><b>${new Set(list.flatMap(o=>o.recommended_location_ids)).size}</b><span>Recommended stores</span></div></div></div><div class="opportunity-list">${list.length?list.map(opportunityCard).join(''):emptyState('No opportunities in this scope','Favie has not prepared a content opportunity for the selected location or group.')}</div></section>`}
function openOpportunity(id){const o=opportunities.find(x=>x.id===id);if(!o)return;openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">AGENT-PREPARED CAMPAIGN DRAFT</div><h2>${o.title}</h2><p>${o.evidence}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="detail-section"><h3>Creative angle</h3><p>${o.angle}</p></div><div class="detail-section"><h3>Recommended scope</h3><div class="editable-line"><span>${o.scope}</span><button class="mini-button">Adjust</button></div></div><div class="detail-section"><h3>Local-first deliverables</h3><p>${o.deliverables}</p><div class="brief-checks">${['Show the real store environment','Use a local staff or guest moment','Keep brand message and CTA consistent','Allow HQ fallback if local asset misses deadline'].map(x=>`<label><input type="checkbox" checked> ${x}</label>`).join('')}</div></div><div class="detail-section"><h3>Linked source evidence</h3>${o.evidence_ids.map(id=>{const r=evidenceById(id);return `<blockquote><button class="evidence-source-button" data-evidence="${id}">${esc(r?.text||id)}<br><small>${id} · ${r?locationName(r.location_id):''}</small></button></blockquote>`}).join('')}</div><div class="detail-section"><h3>Agent has completed</h3>${o.agent.map(x=>`<div class="completed-line">✓ ${x}</div>`).join('')}</div><div class="object-status-grid"><div><span>Object type</span><b>Campaign Draft</b></div><div><span>Object status</span><b>${state.briefApprovedIds.includes(o.id)?'Approved':'Drafted'}</b></div><div><span>Execution</span><b>Not scheduled</b></div><div><span>Next actor</span><b>Brand manager</b></div></div></div><div class="drawer-footer"><button class="secondary-button" data-action="close-drawer">Adjust later</button>${!state.briefApprovedIds.includes(o.id)?`<button class="primary-button dark" data-action="approve-brief-id" data-id="${o.id}">Approve & create tasks</button>`:''}</div>`)}

function coverageCard(a){return `<button class="coverage-card" data-coverage="${a.id}"><div class="coverage-card-head"><div class="coverage-icon">${icon('alert',19)}</div>${pill(a.severity,a.severity==='High'?'bad':'warn')}</div><h3>${a.title}</h3><p>${a.facts[0]}. ${a.action}</p><div class="coverage-meta"><span>${a.location}</span><span>${a.detected}</span><span>${a.confidence}% confidence</span></div><div class="coverage-impact"><div><b>${a.impact.campaigns}</b><span>campaigns</span></div><div><b>${a.impact.posts}</b><span>posts</span></div><div><b>${a.impact.deadline}</b><span>deadline</span></div></div></button>`}
function renderCoverage(){const list=scoped(coverageAnomalies);return `<section class="page">${pageHeader('Coverage anomaly intelligence','Favie detects account, publishing, content-activity, asset, and campaign-compliance anomalies before operators inspect the matrix.',`<button class="secondary-button" data-page="calendar">Open calendar evidence</button>`)}${scopeBanner()}<div class="social-object-banner"><div class="agent-mini-orb">F</div><div><strong>Coverage anomalies are first-class persistent objects.</strong><p>Each one includes linked evidence, Fact / Interpretation / Alternative, confidence, affected campaigns, owner, and a prepared action.</p></div></div><div class="coverage-grid">${list.length?list.map(coverageCard).join(''):emptyState('No active coverage anomalies','All connected social execution objects in this scope are healthy.')}</div></section>`}
function openCoverage(id){const a=coverageAnomalies.find(x=>x.id===id);if(!a)return;openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">COVERAGE ANOMALY INSIGHT</div><h2>${a.title}</h2><p>${a.location} · detected ${a.detected}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="drawer-status-row">${pill(a.severity,a.severity==='High'?'bad':'warn')}${pill(a.status,'neutral')}${pill(`${a.confidence}% confidence`,'good')}</div><div class="truth-grid"><div class="truth-block fact"><span>FACTS</span>${a.facts.map((f,i)=>`<button class="fact-evidence-link" data-evidence="${a.evidence_ids[Math.min(i,a.evidence_ids.length-1)]}"><span style="all:unset">${f}</span><span>Source</span></button>`).join('')}</div><div class="truth-block inference"><span>AGENT INTERPRETATION</span><p>${a.interpretation}</p><p><strong>Alternative:</strong> ${a.alternative}</p></div><div class="truth-block recommendation"><span>PREPARED ACTION</span><p>${a.action}</p></div></div><div class="detail-section"><h3>Execution impact</h3><div class="coverage-impact"><div><b>${a.impact.campaigns}</b><span>campaigns</span></div><div><b>${a.impact.posts}</b><span>posts</span></div><div><b>${a.impact.deadline}</b><span>deadline</span></div></div></div><div class="object-status-grid"><div><span>Object type</span><b>Coverage Anomaly Insight</b></div><div><span>Status</span><b>${a.status}</b></div><div><span>Execution</span><b>Not executed</b></div><div><span>Next actor</span><b>${a.status.includes('external')?'Account owner':'Location manager'}</b></div></div></div><div class="drawer-footer"><button class="secondary-button" data-action="close-drawer">Close</button><button class="primary-button dark" data-action="resolve-coverage" data-id="${a.id}">Approve prepared action</button></div>`)}

function campaignStatusKind(s){return s==='Live'?'good':s==='Needs input'?'warn':'neutral'}
function renderCampaigns(){const list=scoped(campaigns);return `<section class="page">${pageHeader('Agent-managed campaigns','Campaigns enter the workspace only after Favie prepares scope, requirements, local execution modes, risk checks, and fallback.',`<button class="primary-button" data-action="ask-campaign">${icon('spark',17)} Ask Favie for a campaign</button>`)}${scopeBanner()}<div class="campaign-agent-note"><div class="agent-mini-orb">F</div><div><strong>Favie tracks requirement fulfillment, not identical reposts.</strong><span>Local-created, template-adapted, independent, and HQ fallback content remain distinct.</span></div></div><div class="agent-campaign-list">${list.length?list.map((c,i)=>{const scopedProgress=c.progress.filter(p=>currentScopeLocationIds().includes(p.location_id)),ready=scopedProgress.filter(p=>['Fulfilled','Scheduled','Draft ready'].includes(p.status)).length;return `<article class="card agent-campaign"><div class="campaign-color c${i%3+1}"></div><div class="campaign-main"><div class="campaign-kicker">${c.source}</div><h3>${c.title}</h3><p>${scopedProgress.length} scoped locations · ${c.requirements.length} requirements</p></div><div class="campaign-progress"><span>${ready}/${scopedProgress.length}</span><small>Ready in scope</small></div>${pill(c.status,campaignStatusKind(c.status))}<div class="campaign-next"><span>NEXT</span><strong>${c.next}</strong></div><button class="secondary-button" data-campaign="${c.id}">Open matrix</button></article>`}).join(''):emptyState('No campaigns in scope','No active or drafted campaign includes the selected location or group.')}</div></section>`}
function openCampaign(id){const c=campaigns.find(x=>x.id===id);if(!c)return;const rows=c.progress.filter(p=>currentScopeLocationIds().includes(p.location_id));openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">CAMPAIGN REQUIREMENT MATRIX</div><h2>${c.title}</h2><p>${c.source} · ${c.status}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="detail-section"><h3>Required deliverables</h3>${c.requirements.map(r=>`<div class="completed-line">• ${r}</div>`).join('')}</div><div class="detail-section"><h3>Scoped location preview matrix</h3><table class="preview-matrix"><thead><tr><th>Location</th><th>Execution mode</th><th>Requirement match</th><th>Status</th><th>Evidence</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${locationName(r.location_id)}</strong></td><td class="matrix-mode">${r.mode}</td><td>${r.match}%</td><td><span class="matrix-status ${['Publish failed','Account blocked','Forced human review'].includes(r.status)?'bad':['Asset requested','Policy verification'].includes(r.status)?'warn':''}">${r.status}</span></td><td>${r.anomaly_id?`<button class="text-button" data-coverage="${r.anomaly_id}">Open anomaly</button>`:r.post_id?`<button class="text-button" data-post="${r.post_id}">Open post</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><div class="detail-section"><h3>Agent interpretation</h3><p>A location can fulfill the campaign with a local-created post, an approved adapted template, or an HQ fallback when policy permits. Independent posts do not automatically count unless Agent requirement matching links them.</p></div></div><div class="drawer-footer"><button class="secondary-button" data-action="close-drawer">Close</button><button class="primary-button dark" data-page="calendar">Open calendar</button></div>`)}

function localPostCard(p){return `<button class="local-post-card" data-post="${p.id}"><div class="post-thumb"></div><div class="post-type-row"><span class="post-type">${p.content_mode} · ${p.relationship}</span>${pill(p.status,p.status==='Published'?'good':p.status.includes('failed')||p.status==='Blocked'?'bad':'neutral')}</div><h3>${p.title}</h3><p>${locationName(p.location_id)} · ${p.platform}${p.campaign_id?` · linked to ${campaigns.find(c=>c.id===p.campaign_id)?.title}`:''}</p><div class="requirement-meter"><i style="width:${p.matchScore}%"></i></div><div class="requirement-line"><span>Requirement match</span><strong>${p.matchScore}%</strong></div></button>`}
function renderLocalContent(){const list=localPosts.filter(p=>currentScopeLocationIds().includes(p.location_id));return `<section class="page">${pageHeader('Local content intelligence','Favie distinguishes independent local posts, local-made campaign content, template adaptations, and HQ fallback.',`<button class="secondary-button" data-page="campaigns">View campaign requirements</button>`)}${scopeBanner()}<div class="social-object-banner"><div class="agent-mini-orb">F</div><div><strong>Requirement matching runs in the Agent context.</strong><p>The web page only displays the match result, linked campaign, missing requirement, evidence, and final approval state.</p></div></div><div class="local-content-grid">${list.length?list.map(localPostCard).join(''):emptyState('No local content in scope','No linked or independent post object matches the current Scope.')}</div></section>`}
function openPost(id){const p=localPosts.find(x=>x.id===id);if(!p)return;openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">LOCAL CONTENT OBJECT</div><h2>${p.title}</h2><p>${locationName(p.location_id)} · ${p.platform}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="drawer-status-row">${pill(p.content_mode,'neutral')}${pill(p.relationship,p.relationship==='Independent'?'warn':'good')}${pill(p.status,p.status==='Published'?'good':p.status==='Blocked'||p.status.includes('failed')?'bad':'neutral')}</div><div class="detail-section"><h3>Campaign relationship</h3><p>${p.campaign_id?`Linked to ${campaigns.find(c=>c.id===p.campaign_id)?.title}. This local asset may satisfy the listed campaign requirements.`:'Independent local content. It does not count toward a campaign unless Favie links it after requirement matching.'}</p></div><div class="detail-section"><h3>Agent requirement validation</h3>${p.requirements.map(r=>`<div class="completed-line">✓ ${r}</div>`).join('')}<div class="requirement-meter"><i style="width:${p.matchScore}%"></i></div><div class="requirement-line"><span>Overall match</span><strong>${p.matchScore}%</strong></div></div>${p.anomaly_id?`<div class="detail-section"><h3>Blocking anomaly</h3><button class="secondary-button" data-coverage="${p.anomaly_id}">Open Coverage Anomaly Insight</button></div>`:''}</div><div class="drawer-footer"><button class="secondary-button" data-action="close-drawer">Close</button><button class="primary-button dark" data-action="save-adjustment">Adjust final post</button></div>`)}

function renderCalendar(){const days=Array.from({length:35},(_,i)=>i<3?null:i-2<=31?i-2:null),items=calendarObjects.filter(inScope).filter(o=>state.calendarFilter==='all'||o.type===state.calendarFilter),campaignCount=new Set(items.filter(i=>i.type==='campaign').map(i=>i.ref_id)).size,localCount=items.filter(i=>i.type==='local').length,anomalyCount=items.filter(i=>i.type==='anomaly').length;return `<section class="page">${pageHeader('Calendar evidence','The calendar is a scoped control surface. Favie prepares campaigns, requirement matches, local posts, and anomalies before they appear here.',`<button class="secondary-button" data-page="campaigns">Agent campaigns</button>`)}${scopeBanner()}<div class="calendar-agent-bar"><div>${icon('spark',18)} <strong>Favie summary:</strong> ${campaignCount} coordinated campaign${campaignCount===1?'':'s'}, ${localCount} local activity object${localCount===1?'':'s'}, ${anomalyCount} coverage risk${anomalyCount===1?'':'s'} in this scope.</div><button class="text-button" data-page="coverage">Review anomalies →</button></div><div class="calendar-filter-row">${[['all','All objects'],['campaign','Coordinated'],['local','Local content'],['agent','Agent-prepared'],['anomaly','Anomalies']].map(([k,l])=>`<button data-calendar-filter="${k}" class="${state.calendarFilter===k?'active':''}">${l}</button>`).join('')}</div><div class="card calendar"><div class="calendar-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div><div class="calendar-grid">${days.map(day=>!day?'<div class="day-cell muted"></div>':`<div class="day-cell"><div class="day-number">${day}</div>${items.filter(i=>i.day===day).map(i=>`<button class="agent-calendar-item ${i.type}" data-calendar-object="${i.id}"><span>${i.type}</span><strong>${i.title}</strong><small>${i.subtitle}</small></button>`).join('')}</div>`).join('')}</div><div class="calendar-legend"><span><i class="legend-dot orange"></i>Coordinated campaign</span><span><i class="legend-dot purple"></i>Local content</span><span><i class="legend-dot green"></i>Agent-prepared</span><span><i class="legend-dot" style="background:var(--red)"></i>Coverage anomaly</span></div></div></section>`}

function renderLocations(){const ids=currentScopeLocationIds(),list=locations.filter(l=>ids.includes(l.id));return `<section class="page">${pageHeader('Locations','Every row is filtered by Scope and summarizes the Agent objects currently affecting that location.',`<button class="secondary-button" data-page="policies">Manage policies</button>`)}${scopeBanner()}<div class="card signal-table-card"><table class="agent-table"><thead><tr><th>Location</th><th>Current signal</th><th>Policy route</th><th>Open decisions</th><th>Coverage health</th></tr></thead><tbody>${list.map(l=>{const locCases=cases.filter(c=>c.location_ids.includes(l.id)&&['batch','manual','escalated'].includes(caseRoute(c))),anoms=coverageAnomalies.filter(a=>a.location_ids.includes(l.id)),theme=scoped(themes).find(t=>t.location_ids.includes(l.id));return `<tr><td><strong>${l.name}</strong><span>${l.brand}</span></td><td>${theme?.title||'No active review signal'}</td><td>${locCases[0]?routeLabel(caseRoute(locCases[0])):'Routine policy'}</td><td>${locCases.length}</td><td>${anoms.length?pill(`${anoms.length} anomaly`,'warn'):pill('Complete','good')}</td></tr>`}).join('')}</tbody></table></div></section>`}

function policyRow(title,desc,key){const current=state.policies[key];return `<div class="policy-row"><div><h4>${title}</h4><p>${desc}</p></div><div class="policy-options"><button data-policy="${key}" data-level="auto" class="${current==='auto'?'active auto':''}">Auto execute</button><button data-policy="${key}" data-level="batch" class="${current==='batch'?'active batch':''}">Batch approval</button><button data-policy="${key}" data-level="manual" class="${current==='manual'?'active manual':''}">Manual review</button></div></div>`}
function renderPolicies(){return `<section class="page">${pageHeader('Autonomy & agent context','Configure how Policy Engine routes prepared Agent objects. Favie Web remains the evidence and approval layer.',`<button class="primary-button" data-action="save-policies">Save policy changes</button>`)}${scopeBanner()}<div class="policy-layout"><section class="card policy-main"><div class="policy-scope"><div><span>POLICY SCOPE</span><select id="policy-scope"><option>${state.scope.name}</option><option>Mikiya Group default</option><option>Las Vegas exception</option><option>Location manager role</option></select></div><p>Location and role exceptions override broader defaults.</p></div><div class="policy-legend"><strong>Routing clarification:</strong> Batch approval and Manual review both appear in Decision Queue. Batch supports grouped approval; Manual requires individual judgment. Auto-execute objects leave the queue and remain in Activity Log.</div><div class="threshold-card"><div class="threshold-head"><h4>Low-confidence forced review threshold</h4><b>${state.confidenceThreshold}%</b></div><p>Any Insight or action below this confidence enters manual review regardless of the action policy.</p><input id="confidence-threshold" type="range" min="50" max="95" step="1" value="${state.confidenceThreshold}"><div class="threshold-scale"><span>50%</span><span>95%</span></div></div>${policyRow('Routine 4–5 star review replies','Facts verified, no sensitive language, no compensation promise.','routine')}${policyRow('1–3 star public review replies','Agent prepares response and internal follow-up before the queue opens.','lowstar')}${policyRow('Food safety, injury, discrimination, legal threats','Public response remains blocked regardless of lower-risk policy.','critical')}${policyRow('Review-to-content campaign briefs','Agent prepares evidence, scope, brief, requirements, and fallback.','content')}${policyRow('Local social posts using approved templates','Brand facts and local offer language checked before publishing.','template')}${policyRow('Price, compensation, or legal language changes','Medium brand corrections can be configured; critical legal or compensation risk remains blocked.','price')}</section><aside class="card context-panel"><h3>Context available to ZooClaw</h3>${['Brand voice and prohibited phrases','Menu, offers, booking links, and hours','Location hierarchy and responsible managers','Escalation owners and response SLA','Approved campaigns and local posting policy','Trend baselines, topics, and Coverage Anomalies'].map(x=>`<div class="context-check">${icon('check',16)} ${x}</div>`).join('')}<div class="context-warning"><strong>Current missing context</strong><p>${scoped(coverageAnomalies).find(a=>a.id==='cov-denver-facebook')?'Denver Facebook is disconnected. Favie will not claim publishing coverage until an owner reconnects.':'No critical context gap in this scope.'}</p></div><button class="secondary-button full" data-action="show-context">Inspect context sources</button></aside></div><section class="card context-architecture"><div class="section-heading"><div><h3>Business logic placement</h3><p>Scope filtering, confidence routing, risk, clustering, requirement matching, and anomaly detection belong in the Agent context—not in page-load calculations.</p></div></div><div class="agent-boundary-card"><div class="boundary-column agent"><h4>ZooClaw Agent</h4><p>Always-on intelligence and preparation</p><div class="boundary-list"><div><i>✓</i>Filter all objects by current Scope</div><div><i>✓</i>Compute baselines and trend deltas</div><div><i>✓</i>Cluster topics and retain evidence IDs</div><div><i>✓</i>Apply confidence and autonomy routing</div><div><i>✓</i>Match local content to requirements</div><div><i>✓</i>Create Coverage Anomaly Insights</div></div></div><div class="boundary-column web"><h4>Favie Web</h4><p>Control, proof, and final judgment</p><div class="boundary-list"><div><i>1</i>Read scoped prepared objects</div><div><i>2</i>Trace facts to original evidence</div><div><i>3</i>Edit the final output</div><div><i>4</i>Approve, dismiss, or escalate</div><div><i>5</i>View policy and execution audit</div></div></div></div></section></section>`}

function evidenceRecordHtml(r,focused=false){const loc=locationName(r.location_id),stars=r.kind==='review'?`${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}`:'';return `<div id="evidence-${r.id}" class="evidence-review ${focused?'focused':''}"><div class="platform-mark ${r.platform==='Yelp'?'yelp':'google'}">${r.platform?.[0]||'E'}</div><div><strong>${r.reviewer||r.kind.toUpperCase()} · ${loc}</strong>${stars?`<div class="stars">${stars}</div>`:''}<p>${esc(r.text)}</p><span class="evidence-id">${r.id} · ${r.platform} · ${r.time}</span></div></div>`}
function evidenceDrawer(c,focusId=null){const ids=objectEvidenceIds(c),records=ids.map(evidenceById).filter(Boolean);openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">LINKED EVIDENCE PACKET</div><h2>${c.title}</h2><p>${records.length} linked source item${records.length===1?'':'s'} · ${state.scope.name}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="evidence-tabs"><button class="active">Evidence</button><button>Timeline</button><button>Location context</button></div>${records.map(r=>evidenceRecordHtml(r,r.id===focusId)).join('')||emptyState('No evidence','No linked evidence record was found.')}</div>`);if(focusId)setTimeout(()=>document.querySelector(`#evidence-${focusId}`)?.scrollIntoView({behavior:'smooth',block:'center'}),80)}
function openEvidenceOnly(id){const r=evidenceById(id);if(!r)return;openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">SOURCE EVIDENCE</div><h2>${r.id}</h2><p>${locationName(r.location_id)} · ${r.platform} · ${r.time}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body">${evidenceRecordHtml(r,true)}<div class="detail-section"><h3>Agent-detected topics</h3><p>${r.topics.join(' · ')}</p></div><div class="detail-section"><h3>Evidence integrity</h3><p>This record is linked by ID. Facts and Insights reference this exact source instead of a reconstructed example.</p></div></div>`)}
function openTrend(id){const t=trendInsights.find(x=>x.id===id);if(!t)return;openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">PERSISTENT TREND INSIGHT</div><h2>${t.metric}: ${t.value}</h2><p>${t.scope} · ${t.window}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="drawer-status-row">${pill(t.status,t.status==='Needs decision'?'bad':'neutral')}${pill(`${t.confidence}% confidence`,forcedByConfidence(t)?'warn':'good')}${forcedByConfidence(t)?'<span class="forced-review-badge">Forced human review</span>':''}</div><div class="detail-section"><h3>Evidence</h3><p>${t.evidence}</p>${t.evidence_ids.map(id=>`<button class="text-button" data-evidence="${id}">Open ${id}</button>`).join('')}</div><div class="detail-section inference-panel"><span>AGENT INTERPRETATION</span><h3>${t.headline}</h3><p>${t.interpretation}</p></div><div class="detail-section"><h3>Alternative explanations</h3><p>${t.alternative}</p></div><div class="detail-section"><h3>Prepared action</h3><p>${t.action}</p></div><div class="object-status-grid"><div><span>Object type</span><b>Trend Insight</b></div><div><span>Object status</span><b>Active</b></div><div><span>Policy route</span><b>${forcedByConfidence(t)?'Manual review':'Configured policy'}</b></div><div><span>Data freshness</span><b>Latest run · 8:42 AM</b></div></div></div><div class="drawer-footer"><button class="secondary-button" data-action="close-drawer">Close</button><button class="primary-button dark" data-page="queue">Review prepared action</button></div>`)}

function activityDrawer(){const log=state.activityLog.filter(inScope);openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">AGENT ACTIVITY & AUDIT</div><h2>What Favie handled in this scope</h2><p>Auto execution, approvals, dismissals, and policy changes remain auditable.</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="activity-timeline">${log.map((a,i)=>`<div class="timeline-entry"><time>${a.time}</time><span class="timeline-node ${i<2?'active':''}"></span><div><strong>${a.title}</strong><p>${a.detail}</p><button class="text-button">View audit details</button></div></div>`).join('')||emptyState('No activity','No audit events match the selected Scope.')}</div></div>`)}
function notificationDrawer(){const items=[];scoped(cases).filter(c=>['batch','manual','escalated'].includes(caseRoute(c))).forEach(c=>items.push({kind:c.priority==='Critical'?'warn':'',title:c.title,body:`${routeLabel(caseRoute(c))} · ${c.location}`,action:'open-case-id',id:c.id}));scoped(coverageAnomalies).forEach(a=>items.push({kind:'warn',title:a.title,body:`${a.status} · ${a.location}`,action:'open-coverage-id',id:a.id}));scoped(opportunities).filter(o=>!state.briefApprovedIds.includes(o.id)).forEach(o=>items.push({kind:'good',title:o.title,body:'Campaign Draft ready for approval',action:'open-opportunity-id',id:o.id}));openDrawer(`<div class="drawer-header"><div><div class="drawer-kicker">SCOPE-AWARE NOTIFICATIONS</div><h2>${items.length} items need attention</h2><p>${state.scope.name}</p></div><button class="close-button" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="notification-list">${items.map(i=>`<div class="notification-item ${i.kind}"><i></i><div><strong>${i.title}</strong><p>${i.body}</p><button data-action="${i.action}" data-id="${i.id}">Open object →</button></div></div>`).join('')||emptyState('All clear','No current notification matches the selected Scope.')}</div></div>`)}
function dismissCaseModal(c){state.pendingDismissCase=c.id;openModal(`<div class="modal-header"><div><div class="modal-kicker">DISMISS WITH AUDIT</div><h2>Dismiss “${c.title}”?</h2><p>The object will leave the active queue but remain in history. Similar evidence is suppressed unless materially new evidence appears.</p></div><button class="close-button" data-action="close-modal">×</button></div><div class="modal-body"><div class="dismiss-reasons">${['Not actionable','Duplicate of an existing issue','Expected behavior / no intervention','Insufficient evidence'].map((r,i)=>`<button data-dismiss-reason="${r}" class="${i===0?'active':''}">${r}</button>`).join('')}</div></div><div class="modal-footer"><button class="secondary-button" data-action="close-modal">Cancel</button><button class="primary-button dark" data-action="confirm-dismiss">Dismiss & record</button></div>`)}
function approveSafeModal(){const c=scoped(cases).find(x=>x.id==='routine-batch'&&caseRoute(x)==='batch');if(!c){toast('No scoped safe batch','No routine batch is currently routed to approval in this Scope.');return}openModal(`<div class="modal-header"><div><div class="modal-kicker">BATCH APPROVAL</div><h2>${c.title} are ready</h2><p>Favie checked facts, tone, risk, and duplicate phrasing. Approval applies only to reviews in the current Scope.</p></div><button class="close-button" data-action="close-modal">×</button></div><div class="modal-body"><div class="batch-check-strip">${['Location facts verified','No unsupported promises','Brand tone matched','No duplicate wording'].map(x=>`<span>✓ ${x}</span>`).join('')}</div>${evidenceRecords.filter(e=>e.kind==='review'&&c.location_ids.includes(e.location_id)&&currentScopeLocationIds().includes(e.location_id)).slice(0,3).map(r=>`<div class="sample-reply"><div><strong>${locationName(r.location_id)} · ${r.rating}-star ${r.platform}</strong><span>“${esc(r.text)}”</span></div><textarea>Thank you for visiting and sharing your feedback. We appreciate the detail and hope to welcome you back soon.</textarea></div>`).join('')}</div><div class="modal-footer"><button class="secondary-button" data-action="close-modal">Review individually</button><button class="primary-button dark" data-action="confirm-safe" data-id="${c.id}">Approve scoped batch</button></div>`)}

function openScope(){const opts=[{type:'organization',id:'group',eyebrow:'Mikiya Group',name:'All restaurants',symbol:'MG',sub:'3 brands · 6 prototype locations'},{type:'brand',id:'mikiya',eyebrow:'Mikiya Group',name:'Mikiya · All locations',symbol:'M',sub:'3 locations'},{type:'brand',id:'chubby',eyebrow:'Mikiya Group',name:'Chubby Cattle · All locations',symbol:'CC',sub:'2 locations'},{type:'location',id:'temple',eyebrow:'Mikiya · Temple City',name:'Temple City',symbol:'TC',sub:'Single-location agent context'},{type:'location',id:'vegas',eyebrow:'Mikiya · Las Vegas',name:'Las Vegas',symbol:'LV',sub:'Single-location agent context'},{type:'location',id:'rowland',eyebrow:'Mikiya · Rowland Heights',name:'Rowland Heights',symbol:'RH',sub:'Single-location agent context'},{type:'location',id:'denver',eyebrow:'Chubby Cattle · Denver',name:'Denver',symbol:'DV',sub:'Single-location agent context'},{type:'locationGroup',id:'attention',eyebrow:'Dynamic group',name:'Locations needing attention',symbol:'!',sub:'Agent-maintained group'},{type:'locationGroup',id:'california',eyebrow:'Saved group',name:'California locations',symbol:'CA',sub:'Temple City · Rowland Heights · Los Angeles'}];scopePopover.innerHTML=`<input class="scope-search" placeholder="Search brands, locations, or groups…"><div class="scope-section"><h5>Agent working scope</h5>${opts.map(o=>`<button class="scope-option ${state.scope.type===o.type&&state.scope.id===o.id?'active':''}" data-scope='${JSON.stringify(o).replace(/'/g,'&#39;')}'><span class="scope-symbol">${o.symbol}</span><span><strong>${o.name}</strong><span>${o.sub}</span></span>${state.scope.type===o.type&&state.scope.id===o.id?'<b class="scope-check">✓</b>':''}</button>`).join('')}</div><div class="scope-footer-note">Scope changes evidence, insights, queues, opportunities, campaigns, anomalies, and policy evaluation.</div>`;scopePopover.classList.remove('hidden')}

  document.querySelectorAll('[data-strategy]').forEach(el=>el.addEventListener('click',()=>{state.replyStrategy=el.dataset.strategy;document.querySelectorAll('[data-strategy]').forEach(b=>b.classList.toggle('active',b.dataset.strategy===state.replyStrategy));const ta=document.querySelector('#case-reply');if(ta&&state.replyStrategy==='brief')ta.value=ta.value.split('. ').slice(0,2).join('. ')+'.'}));
  document.querySelectorAll('[data-prompt]').forEach(el=>el.addEventListener('click',()=>{const input=document.querySelector('#agent-input');if(input){input.value=el.dataset.prompt;input.focus()}}));

  const threshold=document.querySelector('#confidence-threshold');

}
function bindOverlayEvents(){
  drawer.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>handleAction(el.dataset.action,el)));drawer.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{closeDrawer();state.page=el.dataset.page;render()}));drawer.querySelectorAll('[data-evidence]').forEach(el=>el.addEventListener('click',()=>openEvidenceOnly(el.dataset.evidence)));drawer.querySelectorAll('[data-coverage]').forEach(el=>el.addEventListener('click',()=>openCoverage(el.dataset.coverage)));drawer.querySelectorAll('[data-post]').forEach(el=>el.addEventListener('click',()=>openPost(el.dataset.post)));modal.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>handleAction(el.dataset.action,el)));modal.querySelectorAll('[data-dismiss-reason]').forEach(el=>el.addEventListener('click',()=>{modal.querySelectorAll('[data-dismiss-reason]').forEach(b=>b.classList.remove('active'));el.classList.add('active')}))
}
function updatePolicy(key,level){const before=scoped(cases).filter(c=>c.policyKey===key).map(c=>({id:c.id,route:caseRoute(c)}));state.policies[key]=level;const after=before.map(x=>({id:x.id,before:x.route,after:caseRoute(cases.find(c=>c.id===x.id))})),changed=after.filter(x=>x.before!==x.after);state.policyChangeNotice={affected:after.map(x=>x.id),message:changed.length?`${changed.map(x=>`${cases.find(c=>c.id===x.id).title}: ${routeLabel(x.before)} → ${routeLabel(x.after)}`).join(' · ')}`:`Policy saved. No scoped case changed route because risk or confidence overrides still apply.`};toast('Policy Engine recalculated',state.policyChangeNotice.message);render()}
function handleAction(action,el){
  if(action==='close-drawer'){closeDrawer();return}if(action==='close-modal'){closeModal();return}if(action==='clear-policy-notice'){state.policyChangeNotice=null;render();return}
  if(action==='open-case-id'){state.selectedCase=el.dataset.id;state.page='queue';state.queueFilter=['batch','manual','escalated'].includes(caseRoute(cases.find(c=>c.id===el.dataset.id)))?caseRoute(cases.find(c=>c.id===el.dataset.id)):'all';closeDrawer();render();return}
  if(action==='open-coverage-id'){closeDrawer();openCoverage(el.dataset.id);return}if(action==='open-opportunity-id'){closeDrawer();openOpportunity(el.dataset.id);return}
  if(action==='view-agent-log'||action==='show-activity'){activityDrawer();return}if(action==='notifications'){notificationDrawer();return}if(action==='approve-safe'){approveSafeModal();return}
  if(action==='confirm-safe'){const id=el.dataset.id||'routine-batch';if(!state.completedCaseIds.includes(id))state.completedCaseIds.push(id);state.activityLog.unshift({time:'Just now',title:'Scoped review batch approved and executed',detail:`Approval recorded for ${state.scope.name}.`,scope_ids:currentScopeLocationIds()});closeModal();toast('Batch approved','The scoped reply batch moved to Completed and remains in the audit log.');render();return}
  if(action==='approve-case'){const c=cases.find(x=>x.id===state.selectedCase);if(c?.blocked){toast('Execution blocked','Critical risk requires authorized human review.');return}if(c&&!state.completedCaseIds.includes(c.id))state.completedCaseIds.push(c.id);state.activityLog.unshift({time:'Just now',title:`Approved: ${c.title}`,detail:'Prepared response and follow-up executed under recorded approval.',scope_ids:c.location_ids});toast('Case approved','Object state moved from Drafted to Executed.');render();return}
  if(action==='dismiss-case'){const c=cases.find(x=>x.id===state.selectedCase);if(c)dismissCaseModal(c);return}
  if(action==='confirm-dismiss'){const reason=modal.querySelector('[data-dismiss-reason].active')?.dataset.dismissReason||'Not actionable',id=state.pendingDismissCase,c=cases.find(x=>x.id===id);state.dismissedCases[id]={reason,time:'Just now'};state.activityLog.unshift({time:'Just now',title:`Dismissed: ${c.title}`,detail:`Reason: ${reason}. Duplicate resurfacing is suppressed until materially new evidence arrives.`,scope_ids:c.location_ids});closeModal();toast('Insight dismissed','The decision remains visible in Dismissed and Activity Log.');render();return}
  if(action==='save-adjustment'){toast('Adjustment saved','Favie will apply the edit to this prepared object only.');return}if(action==='escalate-case'){const c=cases.find(x=>x.id===state.selectedCase);if(c){c.blocked=true;c.risk=c.risk==='Low'?'High':c.risk;state.activityLog.unshift({time:'Just now',title:`Escalated: ${c.title}`,detail:'Public execution paused and risk owner task prepared.',scope_ids:c.location_ids})}toast('Escalated','The case moved to Escalations.');render();return}
  if(action==='assign-manager'){toast('Manager verification prepared','The request separates evidence from the unconfirmed root-cause hypothesis.');return}
  if(action==='approve-brief-id'){const id=el.dataset.id;if(!state.briefApprovedIds.includes(id))state.briefApprovedIds.push(id);state.activityLog.unshift({time:'Just now',title:`Campaign Draft approved: ${opportunities.find(o=>o.id===id)?.title}`,detail:'Local-first tasks can now be created; no post has been published.',scope_ids:opportunities.find(o=>o.id===id)?.location_ids||[]});closeDrawer();toast('Campaign Draft approved','Status is Approved; execution remains Not scheduled.');render();return}
  if(action==='open-opportunity-from-theme'){const t=themes.find(x=>x.id===el.dataset.id),o=opportunities.find(x=>x.theme===t?.title);if(o)openOpportunity(o.id);else toast('No draft yet','Favie has not prepared a content opportunity for this theme.');return}
  if(action==='resolve-coverage'){toast('Prepared action approved','Favie recorded approval. The external owner or execution tool must complete the action.');return}
  if(action==='show-context'){openModal(`<div class="modal-header"><div><div class="modal-kicker">ZOOCLAW AGENT CONTEXT</div><h2>What Favie analyzes before the page loads</h2><p>Intelligence is persistent and scope-aware; the web page reads results.</p></div><button class="close-button" data-action="close-modal">×</button></div><div class="modal-body"><div class="guide-grid">${[['1','Scope context','Organization, brand, location, saved group, and dynamic group membership.'],['2','Evidence context','Reviews, platform status, campaigns, local posts, requirements, and policies.'],['3','Persistent intelligence','Trends, topics, risk, opportunities, and coverage anomalies.'],['4','Prepared objects','Drafts, approval tasks, escalations, reminders, and audit events.']].map(x=>`<div><b>${x[0]}</b><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div></div><div class="modal-footer"><button class="primary-button dark" data-action="close-modal">Understood</button></div>`);return}
  if(action==='run-agent-now'){toast('Agent run started','Favie is refreshing scoped baselines, topics, drafts, requirement matches, and coverage anomalies.');return}if(action==='view-evidence'){const c=cases.find(x=>x.id===state.selectedCase);if(c)evidenceDrawer(c);return}
  if(action==='focus-agent'){document.querySelector('#agent-input')?.focus();return}if(action==='send-agent'){sendAgent();return}if(action==='save-policies'){toast('Policies saved','Current routing is already reflected in queues and object badges.');return}
  if(action==='ask-campaign'){state.page='agent-home';render();setTimeout(()=>{const i=document.querySelector('#agent-input');if(i){i.value='Create a local-first campaign from the strongest positive review theme in the current scope.';i.focus()}},80);return}
  if(action==='show-theme-methodology'){toast('Dynamic topic methodology','Favie preserves parent categories while discovering, merging, splitting, and retiring semantic topics.');return}
  if(action==='help'){openModal(`<div class="modal-header"><div><h2>How to explore v4</h2><p>Test the five core claims directly.</p></div><button class="close-button" data-action="close-modal">×</button></div><div class="modal-body"><div class="guide-grid">${[['1','Scope','Switch to Temple City or Denver and watch every page filter.'],['2','Policy routing','Change Price correction to Auto execute and see the case leave the queue.'],['3','Confidence','Raise the threshold and see low-confidence objects force manual review.'],['4','Evidence links','Click an individual Fact to open the exact source record.'],['5','Social intelligence','Open Coverage Anomalies and campaign Preview Matrix.']].map(x=>`<div><b>${x[0]}</b><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div></div>`);return}
  if(action==='logout'){toast('Prototype mode','Logout is disabled.');return}
}
function sendAgent(){const input=document.querySelector('#agent-input');if(!input||!input.value.trim())return;const text=input.value.trim();state.agentMessages.push({role:'user',text:esc(text)});let response=`I am using the active scope “${state.scope.name}”. I found ${activeCases().length} routed cases, ${scoped(themes).length} themes, and ${scoped(coverageAnomalies).length} coverage anomalies.`;if(/trend|evidence|why/i.test(text)){const t=scoped(trendInsights)[0];response=t?`${t.metric} is ${t.value}. Fact: ${t.evidence} Interpretation: ${t.interpretation} Alternative: ${t.alternative} Confidence: ${t.confidence}%.`:'No Trend Insight matches the current scope.'}else if(/content|brief|campaign/i.test(text)){const o=scoped(opportunities)[0];response=o?`I prepared “${o.title}” as a Campaign Draft for ${o.scope}. It is not published and still requires approval.`:'No content opportunity matches the current scope.'}else if(/dismiss/i.test(text)){response='I can dismiss a selected Insight with a recorded reason. Dismissal preserves the audit trail and suppresses duplicate resurfacing until materially new evidence arrives.'}state.agentMessages.push({role:'assistant',text:response});input.value='';render();setTimeout(()=>document.querySelector('#chat-messages')?.scrollTo({top:9999,behavior:'smooth'}),60)}

function sumSeries(map,ids=currentScopeLocationIds()){const first=Object.values(map)[0]||[];return first.map((_,i)=>ids.reduce((s,id)=>s+(map[id]?.[i]||0),0))}
function scopedBaseline(){return currentScopeLocationIds().reduce((s,id)=>s+(waitComplaintBaseline[id]||0),0)}
function waitChartSvg(){const values=sumSeries(waitComplaintSeries),base=scopedBaseline(),labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const W=680,H=220,l=42,r=18,t=18,b=35,max=Math.max(3,...values,Math.ceil(base+1)),x=i=>l+i*(W-l-r)/(values.length-1),y=v=>t+(max-v)*(H-t-b)/max;const path=values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '),area=`${path} L${x(values.length-1)},${H-b} L${x(0)},${H-b} Z`,baseline=values.map((_,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(base).toFixed(1)}`).join(' ');let grid='';for(let i=0;i<=max;i++){const yy=y(i);grid+=`<line class="chart-grid" x1="${l}" y1="${yy}" x2="${W-r}" y2="${yy}"/><text class="chart-axis-text" x="${l-10}" y="${yy+3}" text-anchor="end">${i}</text>`}const ticks=labels.map((d,i)=>`<text class="chart-axis-text" x="${x(i)}" y="${H-10}" text-anchor="middle">${d}</text>`).join('');const pts=values.map((v,i)=>`<circle class="chart-point" cx="${x(i)}" cy="${y(v)}" r="4"/>`).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wait-time complaints over the last seven days"><defs><linearGradient id="waitArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6243"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>${grid}<path class="chart-area" d="${area}"/><path class="chart-line-baseline" d="${baseline}"/><path class="chart-line-main" d="${path}"/>${pts}${ticks}</svg>`}

function reviewMetrics(){const ids=currentScopeLocationIds(),locs=locations.filter(l=>ids.includes(l.id)),reviewsTotal=locs.reduce((s,l)=>s+l.reviews,0)||1;return {rating:locs.reduce((s,l)=>s+l.rating*l.reviews,0)/reviewsTotal,newReviews:ids.reduce((s,id)=>s+reviewOpsMetrics[id].newReviews,0),needs:ids.reduce((s,id)=>s+reviewOpsMetrics[id].needs,0),low:ids.reduce((s,id)=>s+reviewOpsMetrics[id].low,0),escalated:ids.reduce((s,id)=>s+reviewOpsMetrics[id].escalated,0),response:ids.reduce((s,id)=>s+reviewOpsMetrics[id].response,0)/ids.length,total:reviewsTotal}}
